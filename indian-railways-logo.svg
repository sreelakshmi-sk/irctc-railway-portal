    <line x1="184" y1="94" x2="216" y2="94" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <line x1="175" y1="105" x2="225" y2="105" stroke="#ffffff" stroke-width="2" />
    <line x1="200" y1="94" x2="200" y2="115" stroke="#ffffff" stroke-width="2" />

    <!-- Train Roof & Body Outer Silhouette (White & Navy) -->
    <!-- Perspective Side -->
    <path d="M 200,115 L 245,130 L 255,235 L 225,260 L 200,265 Z" fill="#1e3a8a" stroke="#ffffff" stroke-width="2" />
    <!-- Front Face -->
    <path d="M 155,130 L 200,115 L 245,130 L 240,240 L 200,265 L 160,240 Z" fill="#ffffff" stroke="#152d80" stroke-width="2" />
    
