    <path d="M 188,187 C 188,183 192,182 195,183 L 195,196 L 189,196 Z" fill="#e2e8f0" />
    <path d="M 212,187 C 212,183 208,182 205,183 L 205,196 L 211,196 Z" fill="#e2e8f0" />
    <!-- Ashoka Chakra Wheel -->
    <circle cx="200" cy="201" r="5" fill="#ffffff" stroke="#152d80" stroke-width="0.8" />
    <!-- Abacus Base -->
    <rect x="186" y="206" width="28" height="3.5" rx="1" fill="#ffffff" />

